spring:
  application:
    name: sanaesencia-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@sanaescencia_high?TNS_ADMIN=wallet}
    username: ${SPRING_DATASOURCE_USERNAME:ADMIN}
    password: ${SPRING_DATASOURCE_PASSWORD:Bms163163163.}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: SanaesenciaOraclePool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

server:
  port: 8080

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
